# Tag vX.Y.Z (use scripts/release.mjs) -> builds Hermes.exe -> GitHub Release the app self-updates from.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tag must match app version
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != tauri.conf.json version $v"; exit 1; }
      - run: npm ci
      - run: npm run build:exe
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME release/Hermes.exe --title "Hermes $env:GITHUB_REF_NAME" --generate-notes
